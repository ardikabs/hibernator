name: Kind Schedule E2E

# Clock-agnostic schedule cycle. GitHub `schedule` triggers are best-effort
# and never fire at an exact minute, so the suite pins nothing to the wall
# clock: TestNoopScheduleCycle resolves a window relative to the moment it
# starts (hibernate edge ~3 min out, wakeup edge a fixed 5 min later)
# and finishes asserts well inside the 30 min job timeout. The cron time
# below is therefore arbitrary (low contention on runners);
# move it freely without touching the test.
#
# NOTE: `schedule` triggers only run on the default branch. Manual runs
# from any branch via workflow_dispatch.
on:
  schedule:
    # Every 6h at :55 UTC (00:55, 06:55, 12:55, 18:55). The 6h period
    # divides 24h evenly so each slot deterministically exercises one
    # parking branch (00:55: weeknight/weekend, others: daytime/weekend;
    # see resolveParkingWindow). The :55 offset is deliberate: every
    # window edge in the suite sits on the hour or :59 with ~1m grace and
    # runs last ~15m, so :55 keeps 55m clearance from all edges. Do not
    # "tidy" this to :00.
    - cron: '55 */6 * * *'

  workflow_dispatch:

# A GitHub scheduling backlog (e.g. after an outage) must serialize, not
# stack kind clusters: runs are isolated by unique cluster names so overlap
# is harmless, but serial is cheaper.
concurrency:
  group: kind-schedule
  cancel-in-progress: false

jobs:
  kind-schedule:
    name: Kind Schedule Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kind
        run: make kind-tool

      # Full suite: override-driven scenarios plus the wall-clock
      # TestNoopScheduleCycle 4-plan matrix with a relative window
      # (normal cycle, full-day hibernation, day-aware parking hold,
      # full-day active).
      - name: Run Kind Schedule E2E Tests
        run: make test-kind-schedule
