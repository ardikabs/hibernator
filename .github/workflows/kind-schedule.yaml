name: Kind Schedule E2E

# Clock-agnostic schedule cycle. GitHub `schedule` triggers are best-effort
# and never fire at an exact minute, so the suite pins nothing to the wall
# clock: TestNoopScheduleCycle resolves a window relative to the moment it
# starts (hibernate edge ~3 min out, wakeup edge a fixed 5 min later)
# and finishes asserts well inside the 30 min job timeout. The cron time
# below is therefore arbitrary (low contention on runners);
# move it freely without touching the test.
#
# NOTE: `schedule` triggers only run on the default branch. Manual runs
# from any branch via workflow_dispatch.
on:
  schedule:
    - cron: '55 */6 * * *'

  workflow_dispatch:

jobs:
  kind-schedule:
    name: Kind Schedule Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kind
        run: make kind-tool

      # Full suite: override-driven scenarios plus the wall-clock
      # TestNoopScheduleCycle 4-plan matrix with a relative window
      # (normal cycle, full-day hibernation, weekday parking,
      # full-day active).
      - name: Run Kind Schedule E2E Tests
        run: make test-kind-schedule
