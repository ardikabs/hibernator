name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - release/v*

    paths:
      - api/**
      - cmd/**
      - internal/**
      - pkg/**
      - test/**
      - config/**
      - Dockerfile
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/ci.yaml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test-coverage:
    name: Coverage Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Coverage Tests
        run: make test

  test-e2e:
    name: E2E Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setting up Test Dependencies
        run: make envtest

      - name: Run E2E Tests
        run: make test-e2e

  test-awsenv:
    name: AWSEnv Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Start Floci AWS emulator
        run: docker compose -f test/awsenv/environments/floci/compose.yml up -d

      - name: Run AWSEnv Tests
        run: make test-awsenv

      - name: Stop Floci AWS emulator
        if: always()
        run: docker compose -f test/awsenv/environments/floci/compose.yml down -v

  test-k8senv:
    name: K8sEnv Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setting up Test Dependencies
        run: make envtest

      - name: Run K8sEnv Tests
        run: make test-k8senv

  test-kind:
    name: Kind E2E Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kind
        run: make kind-tool

      # PR smoke only (override-driven). The real wall-clock schedule cycle
      # (make test-kind-schedule) stays nightly/manual.
      - name: Run Kind E2E Tests
        run: make test-kind