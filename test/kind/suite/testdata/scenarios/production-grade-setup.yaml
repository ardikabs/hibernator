apiVersion: hibernator.ardikabs.com/v1alpha1
kind: HibernatePlan
metadata:
  name: prod-grade
spec:
  execution:
    strategy:
      type: Parallel
      maxConcurrency: 3
  behavior:
    mode: Strict
  targets:
    - name: workloads
      type: noop
      connectorRef:
        kind: CloudProvider
        name: scn-aws
      parameters:
        randomDelaySeconds: 1
        failureMode: none
        marker: prodgrade-workloads
    - name: nodegroups
      type: noop
      connectorRef:
        kind: CloudProvider
        name: scn-aws
      parameters:
        randomDelaySeconds: 1
        failureMode: none
        marker: prodgrade-nodegroups
    - name: database
      type: noop
      connectorRef:
        kind: CloudProvider
        name: scn-aws
      parameters:
        randomDelaySeconds: 1
        failureMode: none
        marker: prodgrade-database
---
apiVersion: hibernator.ardikabs.com/v1alpha1
kind: ScheduleException
metadata:
  name: prod-change-freeze
  labels:
    hibernator.ardikabs.com/plan: prod-grade
spec:
  planRef:
    name: prod-grade
  type: replace
  windows:
    - start: "00:00"
      end: "23:59"
      daysOfWeek: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
  executionOverride:
    strategy:
      type: DAG
      maxConcurrency: 2
      dependencies:
        - from: workloads
          to: nodegroups
        - from: nodegroups
          to: database
    behavior:
      mode: Strict
